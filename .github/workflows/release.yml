name: release

# Every pushed tag vX.Y.Z builds the .deb (version X.Y.Z) and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the scripts
        run: |
          python3 -m py_compile mvm.py
          bash -n packaging/build-deb.sh

      - name: Work out the version from the tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "tag '$tag' must look like v1.2.3" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build the .deb
        run: packaging/build-deb.sh "${{ steps.ver.outputs.version }}" dist

      - name: Check the package
        run: |
          deb=$(ls dist/*.deb)
          dpkg-deb -I "$deb" | sed -n '1,12p'
          dpkg-deb -c "$deb" | grep -E "usr/bin/mvm|usr/lib/multi-vpn-manager/mvm.py"
          tmp=$(mktemp -d)
          dpkg-deb -x "$deb" "$tmp"
          python3 "$tmp/usr/lib/multi-vpn-manager/mvm.py" --help >/dev/null

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" dist/*.deb \
            --target "$GITHUB_SHA" \
            --title "Multi-VPN Manager ${{ steps.ver.outputs.version }}" \
            --notes "Built from \`${GITHUB_SHA::7}\` for tag \`${{ steps.ver.outputs.tag }}\`.

          Install: \`sudo apt install ./multi-vpn-manager_${{ steps.ver.outputs.version }}_all.deb\`" \
            --verify-tag \
            --latest
